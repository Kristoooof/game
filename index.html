<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Szigetek</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b3a5a;
        touch-action: none;
      }
      :root {
        /* Painted wood: brass rivets in the corners, grain running across, darker towards the foot. */
        --rivet: #d8b468 0 1.2px, #6a4a22 1.9px, transparent 2.5px;
        --panel:
          radial-gradient(circle at 6px 6px, var(--rivet)),
          radial-gradient(circle at calc(100% - 6px) 6px, var(--rivet)),
          radial-gradient(circle at 6px calc(100% - 6px), var(--rivet)),
          radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), var(--rivet)),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.07) 0 2px,
            transparent 2px 7px,
            rgba(255, 220, 160, 0.05) 7px 9px,
            transparent 9px 16px
          ),
          linear-gradient(180deg, #5c4026 0%, #3f2b18 55%, #2c1e10 100%);
        --frame:
          inset 0 0 0 1px rgba(216, 180, 104, 0.45), inset 0 2px 0 rgba(255, 230, 170, 0.18),
          inset 0 -3px 6px rgba(0, 0, 0, 0.35), 0 3px 10px rgba(0, 0, 0, 0.45);
        --gold: #e8c67a;
        --ink: #f6ead0;
      }
      #resources,
      #hud,
      #build {
        z-index: 1;
        font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        color: var(--ink);
      }
      #resources,
      #hud {
        position: fixed;
        left: 8px;
        padding: 6px 12px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        font-size: 15px;
        line-height: 1.3;
        pointer-events: none;
      }
      .warn {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(560px, calc(100vw - 32px));
        padding: 10px 14px;
        background: #7a2e1e;
        color: #fff4e0;
        border: 1px solid #e0a060;
        border-radius: 8px;
        font:
          14px/1.4 Georgia,
          serif;
        z-index: 10;
        cursor: pointer;
      }
      #resources {
        top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-weight: 600;
      }
      #resources span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      #resources svg {
        width: 18px;
        height: 18px;
      }
      #resources small {
        font-size: 12px;
      }
      #resources .gain {
        color: #b8e08a;
      }
      #resources .loss {
        color: #f0907a;
      }
      #resources .where {
        font-weight: normal;
        font-style: italic;
        opacity: 0.8;
      }
      /* Game speed: a small wooden bar of buttons, beside the settings gear. */
      #speed {
        position: fixed;
        top: 8px;
        right: 60px;
        z-index: 1;
        display: flex;
        gap: 2px;
        padding: 4px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
      }
      #speed button {
        min-width: 38px;
        height: 30px;
        border: 0;
        border-radius: 5px;
        background: none;
        color: var(--ink);
        font:
          600 15px 'Palatino Linotype',
          Palatino,
          Georgia,
          serif;
        cursor: pointer;
      }
      #speed button:hover {
        background: rgba(232, 198, 122, 0.15);
      }
      #speed button.active {
        background: linear-gradient(180deg, #c49a52, #8a6430 60%, #6e4c22);
        color: #fffaf0;
      }
      /* The quest card, right, under the speed bar. */
      #quest {
        position: fixed;
        top: 60px;
        right: 8px;
        z-index: 1;
        width: min(290px, calc(100vw - 32px));
        padding: 10px 12px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        color: var(--ink);
        font:
          13.5px/1.35 'Palatino Linotype',
          Palatino,
          'Book Antiqua',
          Georgia,
          serif;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
      }
      #quest .qhead {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
        opacity: 0.8;
      }
      #quest .qhead button {
        border: 0;
        background: none;
        color: var(--gold);
        font-size: 16px;
        cursor: pointer;
      }
      #quest h3 {
        margin: 2px 0 4px;
        font-size: 16px;
        font-weight: normal;
        color: var(--gold);
      }
      #quest p {
        margin: 0 0 8px;
      }
      #quest .bar {
        height: 7px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
        box-shadow: inset 0 0 0 1px rgba(216, 180, 104, 0.3);
        overflow: hidden;
      }
      #quest .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(180deg, #e8c67a, #a87a30);
        transition: width 0.3s;
      }
      #quest small {
        display: block;
        margin-top: 4px;
        opacity: 0.85;
      }
      #toast {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        padding: 8px 16px;
        border: 2px solid #3a2810;
        border-radius: 8px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 240, 200, 0.45), transparent 70%),
          linear-gradient(180deg, #c49a52, #8a6430 60%, #6e4c22);
        box-shadow:
          var(--frame),
          0 0 18px rgba(232, 198, 122, 0.6);
        color: #fffaf0;
        font:
          600 15px 'Palatino Linotype',
          Palatino,
          Georgia,
          serif;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        pointer-events: none;
      }
      #toast[hidden] {
        display: none;
      }
      #toast.warn {
        border-color: #4a1a10;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 200, 180, 0.35), transparent 70%),
          linear-gradient(180deg, #b8463a, #7a2620);
        box-shadow:
          var(--frame),
          0 0 18px rgba(230, 110, 90, 0.5);
      }
      /* The minimap, bottom right, in a wooden frame. */
      #minimap {
        position: fixed;
        right: 8px;
        bottom: 118px;
        z-index: 1;
        padding: 6px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        line-height: 0;
      }
      #minimap canvas {
        cursor: pointer;
      }
      /* The menu: over everything, the game dimmed behind it. */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 15, 30, 0.55);
        font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        color: var(--ink);
      }
      #menu[hidden] {
        display: none;
      }
      #menu .box {
        width: min(420px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 18px 22px;
        border: 2px solid #1e140a;
        border-radius: 10px;
        background: var(--panel);
        box-shadow:
          var(--frame),
          0 10px 40px rgba(0, 0, 0, 0.6);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
      }
      #menu h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: 30px;
        font-weight: normal;
        letter-spacing: 0.08em;
        color: var(--gold);
      }
      #menu h2 {
        margin: 14px 0 6px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(216, 180, 104, 0.35);
        font-size: 17px;
        font-weight: normal;
        color: var(--gold);
      }
      #menu button {
        display: block;
        width: 100%;
        min-height: 40px;
        margin: 4px 0;
        padding: 6px 10px;
        border: 1px solid #1e140a;
        border-radius: 6px;
        background: linear-gradient(180deg, #4a3220, #33220f);
        box-shadow: inset 0 0 0 1px rgba(216, 180, 104, 0.3);
        color: var(--ink);
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
      }
      #menu button:hover:not([disabled]) {
        box-shadow: inset 0 0 0 1px rgba(216, 180, 104, 0.8);
      }
      #menu button[disabled] {
        opacity: 0.45;
        cursor: default;
      }
      #menu button.big {
        text-align: center;
        font-size: 17px;
        background: linear-gradient(180deg, #c49a52, #8a6430 60%, #6e4c22);
        color: #fffaf0;
      }
      #menu .slot small {
        display: block;
        opacity: 0.7;
        font-size: 12.5px;
      }
      #menu .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #menu .row label {
        flex: 1;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #menu input {
        flex: 1;
        min-width: 0;
        min-height: 36px;
        padding: 4px 8px;
        border: 1px solid #1e140a;
        border-radius: 6px;
        background: #2e1f10;
        color: var(--ink);
        font: inherit;
      }
      #menu .row button {
        width: auto;
        text-align: center;
      }
      #menu .note {
        color: #b8e08a;
      }
      /* Side panel for the selected harbour or ship. */
      #panel {
        position: fixed;
        top: 56px;
        left: 8px;
        z-index: 2;
        width: min(340px, calc(100vw - 32px));
        max-height: calc(100vh - 190px);
        overflow-y: auto;
        padding: 12px 14px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        color: var(--ink);
        font:
          14px/1.35 'Palatino Linotype',
          Palatino,
          'Book Antiqua',
          Georgia,
          serif;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
      }
      #panel[hidden] {
        display: none;
      }
      #panel .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(216, 180, 104, 0.35);
      }
      #panel h2,
      #panel h3 {
        margin: 0;
        font-size: 17px;
        font-weight: normal;
        color: var(--gold);
      }
      #panel h3 {
        margin-top: 10px;
        font-size: 15px;
      }
      #panel p {
        margin: 6px 0;
      }
      #panel table {
        width: 100%;
        border-collapse: collapse;
      }
      #panel td {
        padding: 1px 4px 1px 0;
        white-space: nowrap;
      }
      #panel td svg {
        width: 16px;
        height: 16px;
        vertical-align: -3px;
      }
      #panel .n {
        text-align: right;
        font-weight: 600;
      }
      #panel .dim {
        opacity: 0.65;
      }
      #panel button {
        margin: 1px;
        padding: 2px 7px;
        border: 1px solid #1e140a;
        border-radius: 5px;
        background: linear-gradient(180deg, #4a3220, #33220f);
        box-shadow: inset 0 0 0 1px rgba(216, 180, 104, 0.3);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #panel button:hover {
        box-shadow: inset 0 0 0 1px rgba(216, 180, 104, 0.7);
      }
      #panel button.on {
        background: linear-gradient(180deg, #c49a52, #8a6430 60%, #6e4c22);
        color: #fffaf0;
      }
      #panel button.wide {
        width: 100%;
        margin-top: 8px;
        padding: 5px;
      }
      #panel button.close {
        width: 26px;
        height: 26px;
        padding: 0;
        border-radius: 50%;
        font-size: 18px;
        line-height: 1;
      }
      #panel .bad {
        color: #f0a08a;
      }
      #panel .ok {
        color: #b8e08a;
      }
      #panel .bar {
        height: 7px;
        margin: 2px 0 6px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      #panel .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(180deg, #e8c67a, #a87a30);
      }
      #panel button.danger {
        background: linear-gradient(180deg, #8a3428, #5a1a12);
      }
      #panel .stop {
        margin: 6px 0;
        padding: 5px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.18);
      }
      #hud {
        bottom: 110px;
        right: 8px;
        width: fit-content;
        font-style: italic;
      }
      #build {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 15px;
        line-height: 1.2;
        background: linear-gradient(0deg, rgba(20, 14, 8, 0.75), rgba(20, 14, 8, 0));
      }
      #build .tabs,
      #build .items {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }
      #build button {
        flex: none;
        min-height: 44px;
        padding: 6px 14px;
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        font: inherit;
        cursor: pointer;
        transition:
          box-shadow 0.15s,
          transform 0.15s;
      }
      #build .tabs button {
        flex-direction: row;
        align-items: center;
        gap: 7px;
      }
      #build .ico {
        width: 22px;
        height: 22px;
        filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.5));
      }
      #build button:hover {
        transform: translateY(-1px);
        box-shadow:
          var(--frame),
          0 0 10px rgba(232, 198, 122, 0.35);
      }
      #build button small {
        display: block;
        opacity: 0.75;
        font-size: 12px;
      }
      /* Chosen: a brass plate, glowing. */
      #build button.active {
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 240, 200, 0.45), transparent 70%),
          linear-gradient(180deg, #c49a52, #8a6430 60%, #6e4c22);
        border-color: #3a2810;
        color: #fffaf0;
        box-shadow:
          var(--frame),
          0 0 14px rgba(232, 198, 122, 0.6);
      }
      #build button.danger.active {
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 200, 180, 0.35), transparent 70%),
          linear-gradient(180deg, #b8463a, #7a2620);
        box-shadow:
          var(--frame),
          0 0 14px rgba(230, 110, 90, 0.6);
      }
      #settings,
      #fps {
        position: fixed;
        right: 8px;
        z-index: 1;
        font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        color: var(--ink);
      }
      #settings {
        top: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      #settings .gear {
        width: 44px;
        height: 44px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        color: var(--ink);
        font-size: 22px;
        cursor: pointer;
      }
      #settings .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        font-size: 15px;
      }
      #settings .panel[hidden] {
        display: none;
      }
      #settings .head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: -4px 0 2px;
        border-bottom: 1px solid rgba(216, 180, 104, 0.35);
        padding-bottom: 6px;
      }
      #settings h2 {
        margin: 0;
        font-size: 17px;
        font-weight: normal;
        color: var(--gold);
        letter-spacing: 0.04em;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.7);
      }
      #settings .row {
        display: grid;
        grid-template-columns: 150px 210px;
        align-items: center;
        gap: 12px;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
      }
      #settings .drop {
        position: relative;
      }
      #settings .panel button {
        font: inherit;
        color: var(--ink);
        cursor: pointer;
      }
      /* Dropdown plate: darker inset wood with a brass edge and a carved arrow. */
      #settings .pick {
        width: 100%;
        min-height: 32px;
        padding: 4px 26px 4px 10px;
        border: 1px solid #1e140a;
        border-radius: 6px;
        position: relative;
        background: linear-gradient(180deg, #2e1f10, #3d2a17);
        box-shadow:
          inset 0 0 0 1px rgba(216, 180, 104, 0.3),
          inset 0 2px 4px rgba(0, 0, 0, 0.5);
        text-align: left;
      }
      #settings .pick::after {
        content: '▾';
        position: absolute;
        right: 9px;
        color: var(--gold);
      }
      #settings .pick:hover,
      #settings .toggle:hover {
        box-shadow:
          inset 0 0 0 1px rgba(216, 180, 104, 0.6),
          inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      #settings .list {
        position: absolute;
        z-index: 2;
        top: calc(100% + 2px);
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        padding: 3px;
        border: 2px solid #1e140a;
        border-radius: 6px;
        background: var(--panel);
        box-shadow: var(--frame);
      }
      #settings .list[hidden] {
        display: none;
      }
      #settings .list button {
        padding: 5px 8px;
        border: 0;
        border-radius: 4px;
        background: none;
        text-align: left;
      }
      #settings .list button:hover {
        background: linear-gradient(180deg, #c49a52, #8a6430);
        color: #fffaf0;
      }
      /* Wooden switch: a brass knob slides right when on. */
      #settings .toggle {
        position: relative;
        width: 52px;
        height: 26px;
        border: 1px solid #1e140a;
        border-radius: 13px;
        background: linear-gradient(180deg, #2e1f10, #3d2a17);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      #settings .toggle::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f3dc9a, #b88a40 60%, #6e4c22);
        transition: left 0.15s;
      }
      #settings .toggle[aria-pressed='true'] {
        background: linear-gradient(180deg, #6e5a22, #8a7430);
      }
      #settings .toggle[aria-pressed='true']::after {
        left: 29px;
      }
      #settings .close {
        width: 26px;
        height: 26px;
        padding: 0;
        border: 1px solid #1e140a;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #6a4a2a, #2e1f10);
        box-shadow: inset 0 0 0 1px rgba(216, 180, 104, 0.45);
        font-size: 18px;
        line-height: 1;
      }
      #settings small {
        max-width: 372px;
        opacity: 0.7;
      }
      #fps {
        top: 60px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        font:
          13px/1.2 ui-monospace,
          monospace;
        white-space: pre;
        pointer-events: none;
      }
      /* Phones: the resources in a smaller strip, speed and quest beneath it, the panel as a sheet
         above the build bar; no minimap (the map is a swipe away). */
      @media (max-width: 700px) {
        #resources {
          right: 62px;
          padding: 4px 8px;
          gap: 2px 9px;
          font-size: 13px;
        }
        #resources svg {
          width: 15px;
          height: 15px;
        }
        #speed {
          top: auto;
          right: 8px;
          bottom: 122px;
        }
        #quest {
          top: auto;
          left: 8px;
          right: auto;
          bottom: 122px;
          width: calc(100vw - 240px);
          min-width: 140px;
        }
        #panel {
          top: auto;
          left: 8px;
          right: 8px;
          bottom: 120px;
          width: auto;
          max-height: 48vh;
        }
        #hud {
          bottom: 170px;
        }
        #minimap {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="resources"></div>
    <div id="speed"></div>
    <div id="hud"></div>
    <div id="panel"></div>
    <div id="build"></div>
    <div id="quest"></div>
    <div id="toast" hidden></div>
    <div id="minimap"></div>
    <div id="settings"></div>
    <div id="menu" hidden></div>
    <div id="fps" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
