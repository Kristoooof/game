<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Szigetek</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b3a5a;
        touch-action: none;
      }
      :root {
        /* Painted wood: brass rivets in the corners, grain running across, darker towards the foot. */
        --rivet: #d8b468 0 1.2px, #6a4a22 1.9px, transparent 2.5px;
        --panel:
          radial-gradient(circle at 6px 6px, var(--rivet)),
          radial-gradient(circle at calc(100% - 6px) 6px, var(--rivet)),
          radial-gradient(circle at 6px calc(100% - 6px), var(--rivet)),
          radial-gradient(circle at calc(100% - 6px) calc(100% - 6px), var(--rivet)),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.07) 0 2px,
            transparent 2px 7px,
            rgba(255, 220, 160, 0.05) 7px 9px,
            transparent 9px 16px
          ),
          linear-gradient(180deg, #5c4026 0%, #3f2b18 55%, #2c1e10 100%);
        --frame:
          inset 0 0 0 1px rgba(216, 180, 104, 0.45), inset 0 2px 0 rgba(255, 230, 170, 0.18),
          inset 0 -3px 6px rgba(0, 0, 0, 0.35), 0 3px 10px rgba(0, 0, 0, 0.45);
        --gold: #e8c67a;
        --ink: #f6ead0;
      }
      #resources,
      #hud,
      #build {
        z-index: 1;
        font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        color: var(--ink);
      }
      #resources,
      #hud {
        position: fixed;
        left: 8px;
        padding: 6px 12px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        font-size: 15px;
        line-height: 1.3;
        pointer-events: none;
      }
      .warn {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(560px, calc(100vw - 32px));
        padding: 10px 14px;
        background: #7a2e1e;
        color: #fff4e0;
        border: 1px solid #e0a060;
        border-radius: 8px;
        font:
          14px/1.4 Georgia,
          serif;
        z-index: 10;
        cursor: pointer;
      }
      #resources {
        top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-weight: 600;
      }
      #resources span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      #resources svg {
        width: 18px;
        height: 18px;
      }
      #hud {
        bottom: 110px;
        right: 8px;
        width: fit-content;
        font-style: italic;
      }
      #build {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 15px;
        line-height: 1.2;
        background: linear-gradient(0deg, rgba(20, 14, 8, 0.75), rgba(20, 14, 8, 0));
      }
      #build .tabs,
      #build .items {
        display: flex;
        gap: 6px;
        overflow-x: auto;
      }
      #build button {
        flex: none;
        min-height: 44px;
        padding: 6px 14px;
        display: inline-flex;
        flex-direction: column;
        justify-content: center;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        color: var(--ink);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        font: inherit;
        cursor: pointer;
        transition:
          box-shadow 0.15s,
          transform 0.15s;
      }
      #build .tabs button {
        flex-direction: row;
        align-items: center;
        gap: 7px;
      }
      #build .ico {
        width: 22px;
        height: 22px;
        filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.5));
      }
      #build button:hover {
        transform: translateY(-1px);
        box-shadow:
          var(--frame),
          0 0 10px rgba(232, 198, 122, 0.35);
      }
      #build button small {
        display: block;
        opacity: 0.75;
        font-size: 12px;
      }
      /* Chosen: a brass plate, glowing. */
      #build button.active {
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 240, 200, 0.45), transparent 70%),
          linear-gradient(180deg, #c49a52, #8a6430 60%, #6e4c22);
        border-color: #3a2810;
        color: #fffaf0;
        box-shadow:
          var(--frame),
          0 0 14px rgba(232, 198, 122, 0.6);
      }
      #build button.danger.active {
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 200, 180, 0.35), transparent 70%),
          linear-gradient(180deg, #b8463a, #7a2620);
        box-shadow:
          var(--frame),
          0 0 14px rgba(230, 110, 90, 0.6);
      }
      #settings,
      #fps {
        position: fixed;
        right: 8px;
        z-index: 1;
        font-family: 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
        color: var(--ink);
      }
      #settings {
        top: 8px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
      }
      #settings .gear {
        width: 44px;
        height: 44px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        color: var(--ink);
        font-size: 22px;
        cursor: pointer;
      }
      #settings .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 2px solid #1e140a;
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--frame);
        font-size: 15px;
      }
      #settings .panel[hidden] {
        display: none;
      }
      #settings label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      #settings select {
        min-height: 32px;
        font: inherit;
      }
      #settings small {
        max-width: 220px;
        opacity: 0.7;
      }
      #fps {
        top: 60px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        font:
          13px/1.2 ui-monospace,
          monospace;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="resources"></div>
    <div id="hud"></div>
    <div id="build"></div>
    <div id="settings"></div>
    <div id="fps" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
